version: 1
environment: development
allow_mock_services: true

services:
  identity:
    provider: supabase
    mode: real
    endpoint: https://supabase.karios.tech
    env:
      publishable_key: STT_SUPABASE_PUBLISHABLE_KEY

  legacy_data:
    provider: direct-postgres-readonly
    mode: real
    env:
      database_url: STT_LEGACY_DATABASE_URL

  license:
    provider: stt-account-membership
    mode: real
    endpoint: https://fjozndbjkinl.sealosbja.site

  payment:
    provider: stt-web-membership
    mode: real
    endpoint: https://dean.karios.site/login

  smtp:
    provider: local-outbox
    mode: mock
    mock:
      output_directory: .local/mock-mail
      accepted: true

  updates:
    provider: static-update-manifest
    mode: mock
    mock:
      update_available: false
      manifest_path: fixtures/mock/update-manifest.json
