[project]
name = "karios-stt-desktop"
version = "0.1.0"
description = "Local-first desktop timetable scheduling application"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "ortools==9.15.6755",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.9",
  "PyYAML==6.0.2",
  "reportlab==5.0.1",
  "uvicorn==0.35.0",
]

[project.scripts]
stt-desktop = "stt_desktop.cli:main"
stt-sidecar = "stt_desktop.sidecar_main:main"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.12.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidecar/stt_desktop"]

[tool.pytest.ini_options]
pythonpath = ["sidecar"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
